[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pytest-dotmock"
version = "0.2.0"
description = "pytest plugin for hosted DotMock LLM mocks: per-test sessions, sequence resets, and journal assertions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
keywords = ["pytest", "mock", "llm", "openai", "anthropic", "dotmock"]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = ["pytest>=7"]

[project.urls]
Homepage = "https://dotmock.com/docs/guides/cli"

[project.entry-points.pytest11]
dotmock = "pytest_dotmock.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_dotmock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
