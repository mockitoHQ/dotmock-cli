name: DotMock LLM mocks
description: >-
  Point tests at a hosted DotMock LLM mock: optionally apply a dotmock.yaml definition, reset
  sequence counters for a per-run session, and export OPENAI_BASE_URL / ANTHROPIC_BASE_URL /
  DOTMOCK_URL / DOTMOCK_SESSION for later steps. The post step summarizes the session's journal.
author: DotMock
branding:
  icon: cloud
  color: purple

inputs:
  api-key:
    description: DotMock API key (store it as a secret, e.g. secrets.DOTMOCK_API_KEY).
    required: true
  api:
    description: API id or subdomain. Optional when `config` is set (the definition's id/subdomain is used).
    default: ""
  config:
    description: Optional path to a dotmock.yaml definition to `dotmock config apply` first (relative to working-directory).
    default: ""
  session:
    description: X-Dotmock-Session value isolating sequence counters and the journal for this run.
    default: ${{ github.run_id }}-${{ github.run_attempt }}
  cli-version:
    description: "@dotmock/cli version range to install."
    default: ^0.3.0
  api-url:
    description: DotMock API base URL override (defaults to the hosted service).
    default: ""
  working-directory:
    description: Directory `config` is resolved against.
    default: .
  export-dummy-keys:
    description: Set OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY to "dotmock" when they are not already set, so SDK clients can be constructed.
    default: "true"
  journal-summary:
    description: Print the session's journal summary (and add it to the job summary) in the post step.
    default: "true"

outputs:
  url:
    description: Hosted mock root, e.g. https://assistant-t1a2b3c4.mock.rest
  openai-base-url:
    description: OpenAI-compatible base URL (<url>/v1).
  anthropic-base-url:
    description: Anthropic SDK base URL (<url>).
  api-id:
    description: Resolved API id.
  session:
    description: The X-Dotmock-Session used for this run.

# A composite action cannot register a post step, so this is a dependency-free
# Node action: main configures the hosted API, post reports the journal.
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: always()
