# Builds and publishes integrations/python (pytest-dotmock) to PyPI with
# trusted publishing (OIDC, no API token). One-time setup on pypi.org:
#   Project "pytest-dotmock" -> Publishing -> add a GitHub publisher:
#   owner mockitoHQ, repo dotmock-cli, workflow publish-pytest-dotmock.yml,
#   environment "pypi".
# Release: bump integrations/python/pyproject.toml `version`, then push a tag
# `pytest-dotmock-v<version>` (or run this workflow manually with dry_run=false).
name: Publish pytest-dotmock

on:
  push:
    tags: ["pytest-dotmock-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only (do not upload)"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/python

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/pytest-dotmock-v')
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "pytest-dotmock-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pytest
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-dotmock-dist
          path: integrations/python/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pytest-dotmock-v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytest-dotmock-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
